config system global
    set hostname "MultiVDOM-FortiGate"
end
config system dns
    set primary 192.0.2.53
end
config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "time.example.net"
        next
    end
end
config vdom
    edit "root"
        config system interface
            edit "wan1"
                set role wan
            next
            edit "lan1"
                set role lan
            next
        end
        config firewall address
            edit "SERVER"
                set subnet 10.10.10.10 255.255.255.255
            next
            edit "ROOT_USERS"
                set subnet 10.0.0.0 255.255.255.0
            next
        end
        config firewall service custom
            edit "ROOT_HTTPS"
                set tcp-portrange 443
            next
        end
        config firewall service group
            edit "SHARED_GROUP"
                set member "ROOT_HTTPS"
            next
        end
        config firewall vip
            edit "SHARED_VIP"
                set extip 198.51.100.10
                set mappedip 10.10.10.10
            next
        end
        config ips sensor
            edit "SHARED_IPS"
                set comment "root profile"
                set password "ROOT_PROFILE_SECRET"
            next
        end
        config vpn ipsec phase1-interface
            edit "SHARED_VPN"
                set interface "wan1"
                set ike-version 2
                set proposal aes256-sha256
                set psksecret "ROOT_PSK_SECRET"
            next
        end
        config firewall policy
            edit 10
                set name "Root Broad"
                set srcintf "lan1"
                set dstintf "wan1"
                set srcaddr "all"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL"
            next
            edit 11
                set name "Root Specific"
                set srcintf "lan1"
                set dstintf "wan1"
                set srcaddr "ROOT_USERS"
                set dstaddr "all"
                set action accept
                set service "ROOT_HTTPS"
            next
            edit 12
                set name "Root Objects"
                set srcintf "wan1"
                set dstintf "lan1"
                set srcaddr "SERVER"
                set dstaddr "SHARED_VIP"
                set action accept
                set service "SHARED_GROUP"
                set ips-sensor "SHARED_IPS"
            next
        end
    next
    edit "VDOM-B"
        config system interface
            edit "wan1"
                set role wan
            next
            edit "lan1"
                set role lan
            next
        end
        config firewall address
            edit "SERVER"
                set subnet 172.16.10.10 255.255.255.255
            next
            edit "BRANCH_USERS"
                set subnet 172.16.0.0 255.255.0.0
            next
        end
        config firewall service custom
            edit "BRANCH_SSH"
                set tcp-portrange 22
            next
        end
        config firewall service group
            edit "SHARED_GROUP"
                set member "BRANCH_SSH"
            next
        end
        config firewall vip
            edit "SHARED_VIP"
                set extip 203.0.113.20
                set mappedip 172.16.10.10
            next
        end
        config ips sensor
            edit "SHARED_IPS"
                set comment "branch profile"
                set private-key "BRANCH_PRIVATE_SECRET"
            next
        end
        config vpn ipsec phase1-interface
            edit "SHARED_VPN"
                set interface "wan1"
                set ike-version 2
                set proposal aes256-sha256
                set psksecret "BRANCH_PSK_SECRET"
            next
        end
        config firewall policy
            edit 10
                set name "Branch Broad"
                set srcintf "lan1"
                set dstintf "wan1"
                set srcaddr "all"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL"
            next
            edit 12
                set name "Branch Objects"
                set srcintf "wan1"
                set dstintf "lan1"
                set srcaddr "SERVER"
                set dstaddr "SHARED_VIP"
                set action accept
                set service "SHARED_GROUP"
                set ips-sensor "SHARED_IPS"
            next
        end
    next
end
