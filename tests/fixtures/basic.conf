config system interface
    edit "port1"
        set role wan
        set allowaccess ping https ssh
    next
    edit "port2"
        set role lan
        set allowaccess ping
    next
    edit "dmz"
        set role dmz
    next
end
config firewall address
    edit "LAN_NET"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "SERVER_1"
        set subnet 10.0.0.50 255.255.255.255
    next
    edit "WEB_SERVER"
        set fqdn "web.example.com"
    next
    edit "SECRET_ADDR"
        set subnet 192.168.1.1 255.255.255.255
    next
end
config firewall addrgrp
    edit "INTERNAL_SERVERS"
        set member "SERVER_1"
    next
end
config firewall service custom
    edit "CUSTOM_8080"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 8080
    next
    edit "CUSTOM_RDP"
        set tcp-portrange 3389
    next
end
config firewall service group
    edit "WEB_SERVICES"
        set member "HTTP" "HTTPS" "CUSTOM_8080"
    next
end
config firewall vip
    edit "VIP_WEB"
        set extip 203.0.113.10
        set extintf "port1"
        set mappedip "10.0.0.50"
        set portforward enable
        set extport 443
        set mappedport 8443
        set protocol tcp
    next
end
config firewall policy
    edit 10
        set name "Internet Access"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "LAN_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "WEB_SERVICES"
        set utm-status enable
        set av-profile "default"
        set webfilter-profile "default"
        set logtraffic all
    next
    edit 20
        set name "Web Publishing"
        set srcintf "port1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "VIP_WEB"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
    edit 30
        set name "WAN RDP Admin"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "SERVER_1"
        set action accept
        set service "RDP"
        set logtraffic disable
    next
    edit 40
        set name "Broad Internal Access"
        set srcintf "port2"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
        set logtraffic disable
    next
    edit 50
        set name "Disabled Rule"
        set status disable
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "LAN_NET"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
end
