config vpn ipsec phase1-interface
    edit "P1_LEGACY"
        set interface "port1"
        set ike-version 1
        set peertype any
        set net-device disable
        set proposal 3des-sha1 des-md5
        set dhgrp 1 2 5
        set remote-gw 198.51.100.1
        set psksecret "SUPER_SECRET_PSK_DO_NOT_EXPOSE_12345"
    next
    edit "P1_MODERN"
        set interface "port1"
        set ike-version 2
        set peertype any
        set proposal aes256-sha256
        set dhgrp 14 19
        set remote-gw 198.51.100.2
        set psksecret "ANOTHER_SECRET_PSK_9999"
    next
end
config vpn ipsec phase2-interface
    edit "P2_LEGACY"
        set phase1name "P1_LEGACY"
        set proposal des-md5
        set dhgrp 2
        set pfs disable
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
    edit "P2_MODERN"
        set phase1name "P1_MODERN"
        set proposal aes256-sha256
        set dhgrp 14
        set pfs enable
        set src-subnet 10.0.0.0 255.255.255.0
        set dst-subnet 192.168.10.0 255.255.255.0
    next
    edit "P2_ORPHAN"
        set phase1name "NON_EXISTENT_P1"
        set proposal aes128-sha256
    next
end
