config ips sensor
    edit "custom_ips"
        set comment "Custom IPS Sensor"
        config entries
            edit 1
                set rule 1000
            next
        end
    next
end
config antivirus profile
    edit "custom_av"
        set comment "Custom Antivirus"
    next
end
config webfilter profile
    edit "custom_wf"
        set comment "Custom Webfilter"
    next
end
config application list
    edit "custom_app"
        set comment "Custom App Control"
    next
end
config firewall ssl-ssh-profile
    edit "custom_ssl"
        set comment "Custom SSL Inspection Profile"
    next
end
config dnsfilter profile
    edit "custom_dns"
        set comment "Custom DNS Filter"
    next
end
config firewall policy
    edit 1
        set name "Policy With Builtin SSL"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set ips-sensor "custom_ips"
    next
    edit 2
        set name "Policy With Unresolved Profile"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set utm-status enable
        set av-profile "non_existent_av_profile"
    next
    edit 3
        set name "UTM Enabled No Profiles"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set utm-status enable
    next
    edit 4
        set name "UTM Disabled With Profile"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set utm-status disable
        set webfilter-profile "custom_wf"
    next
end
