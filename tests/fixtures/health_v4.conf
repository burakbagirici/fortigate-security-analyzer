config system global
    set hostname "FortiGate-V4"
    set admintimeout 45
    set admin-telnet enable
    set admin-ssh-port 2222
    set admin-sport 8443
    set admin-https-redirect disable
    set login-banner enable
    set gui-display-hostname enable
    set login-timestamp enable
    set cli-audit-log disable
end
config system admin
    edit "admin_no_2fa"
        set accprofile "super_admin"
        set status enable
        set two-factor disable
        set password "ADMIN_PASSWORD_SECRET"
    next
    edit "admin_with_2fa"
        set accprofile "super_admin"
        set status enable
        set two-factor fortitoken
        set fortitoken "TOKEN_SECRET"
    next
    edit "disabled_admin"
        set accprofile "super_admin"
        set status disable
        set two-factor disable
    next
end
config system password-policy
    set status enable
    set minimum-length 8
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-non-alphanumeric 1
    set min-number 1
    set expire-status enable
    set expire-day 90
    set password "PASSWORD_POLICY_SECRET"
end
config log setting
    set log-policy-name enable
    set log-policy-comment enable
    set implicit-log disable
end
config antivirus settings
    set av-failopen pass
    set traffic-submit enable
    set private-key "ANTIVIRUS_PRIVATE_SECRET"
end
config ips global
    set fail-open enable
    set traffic-submit enable
    set auth-token "IPS_TOKEN_SECRET"
end
config firewall policy
    edit 100
        set name "Operational Review Policy"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
        set inspection-mode flow
        set logtraffic-start enable
        set capture-packet enable
        set auto-asic-offload disable
    next
    edit 101
        set name "Inventory Only Policy"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
        set inspection-mode proxy
        set logtraffic-start enable
        set auto-asic-offload enable
    next
end
config firewall DoS-policy
    edit 1
        set name "WAN DoS Inventory"
        set interface "wan"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set status enable
        config anomaly
            edit "tcp_syn_flood"
                set status enable
                set threshold 2000
            next
            edit "udp_flood"
                set status enable
                set threshold 3000
            next
        end
    next
end
