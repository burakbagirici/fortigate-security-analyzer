config firewall address
    edit "NET_10_0_0_0_8"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "NET_10_0_1_0_24"
        set subnet 10.0.1.0 255.255.255.0
    next
end
config firewall policy
    edit 101
        set name "Broad Rule 1"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_0_0_8"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 102
        set name "Duplicate Rule"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_0_0_8"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 103
        set name "Fully Shadowed Rule"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_1_0_24"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 104
        set name "Conflicting Action Shadowed"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_1_0_24"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "HTTP"
    next
    edit 105
        set name "Rule With Unsupported Match"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_0_0_8"
        set dstaddr "all"
        set action accept
        set users "john_doe"
        set service "ALL"
    next
    edit 106
        set name "Rule With Different Schedule"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_1_0_24"
        set dstaddr "all"
        set action accept
        set schedule "work-hours"
        set service "ALL"
    next
    edit 107
        set name "Rule Omitted Schedule"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_1_0_24"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
    edit 108
        set name "Disabled Earlier Rule"
        set status disable
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
    edit 109
        set name "Rule Following Disabled"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "NET_10_0_1_0_24"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH"
    next
end
