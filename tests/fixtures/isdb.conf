config system interface
    edit "lan"
        set role lan
    next
    edit "wan"
        set role wan
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan"
            set zone "virtual-wan-link"
        next
    end
end
config firewall internet-service-name
    edit "Google-Gmail"
        set internet-service-id 65646
        set type default
    next
end
config firewall internet-service-group
    edit "Cloud-Apps"
        set direction destination
        set member "Google-Gmail" "Microsoft-Office365"
    next
end
config firewall internet-service-custom
    edit "Local-SaaS"
        set comment "Local application endpoints"
        set reputation 4
        set password "must-not-be-parsed"
        config entry
            edit 1
                set protocol 6
                set dst "all"
            next
        end
    next
end
config firewall internet-service-custom-group
    edit "Business-Apps"
        set comment "Approved local services"
        set member "Local-SaaS"
        set private-key "must-not-be-parsed"
    next
end
config antivirus profile
    edit "av-isdb"
        set comment "ISDB inspection"
    next
end
config firewall policy
    edit 1
        set name "ISDB ID"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set internet-service enable
        set internet-service-id 65646
        set action accept
        set schedule "always"
    next
    edit 2
        set name "ISDB Name"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set internet-service enable
        set internet-service-name "Google-Gmail"
        set action accept
    next
    edit 3
        set name "ISDB Group"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set internet-service enable
        set internet-service-group "Cloud-Apps"
        set action accept
    next
    edit 4
        set name "Source ISDB"
        set srcintf "wan"
        set dstintf "lan"
        set internet-service-src enable
        set internet-service-src-name "Google-Gmail"
        set dstaddr "all"
        set service "HTTPS"
        set action accept
    next
    edit 5
        set name "Custom ISDB"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set internet-service enable
        set internet-service-custom "Local-SaaS"
        set action accept
    next
    edit 6
        set name "Custom Group via SDWAN"
        set srcintf "lan"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set internet-service enable
        set internet-service-custom-group "Business-Apps"
        set action accept
    next
    edit 7
        set name "Profiled ISDB"
        set srcintf "lan"
        set dstintf "wan"
        set srcaddr "all"
        set internet-service enable
        set internet-service-fortiguard "FQDN-Microsoft-Microsoft.Update"
        set action accept
        set utm-status enable
        set av-profile "av-isdb"
    next
end
