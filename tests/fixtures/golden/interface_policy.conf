#config-version=FG100F-7.2.5-build1517:00000000
config system global
    set hostname "FortiGate-InterfacePolicy-Golden"
end
config system interface
    edit "wan1"
        set role wan
        set allowaccess ping https ssh
    next
    edit "lan1"
        set role lan
        set allowaccess ping
    next
    edit "mgmt1"
        set dedicated-to management
        set allowaccess https ssh
    next
end
config ips sensor
    edit "ips-custom"
    next
    edit "default"
    next
end
config antivirus profile
    edit "av-custom"
    next
end
config firewall address
    edit "LAN_Subnet"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall interface-policy
    edit 1
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set ips-sensor-status enable
        set ips-sensor "ips-custom"
        set logtraffic all
        set status enable
        set comments "Inbound WAN IPS inspection"
    next
    edit 2
        set interface "lan1"
        set srcaddr "LAN_Subnet"
        set dstaddr "all"
        set service "HTTP" "HTTPS"
        set av-profile-status enable
        set av-profile "av-custom"
        set dsri enable
        set status enable
        set comments "LAN Malware inspection"
    next
    edit 3
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set ips-sensor-status disable
        set ips-sensor "default"
        set status enable
        set comments "Stale/disabled IPS profile reference"
    next
    edit 4
        set interface "lan1"
        set srcaddr "LAN_Subnet"
        set dstaddr "all"
        set service "ALL"
        set ips-sensor-status enable
        set ips-sensor "missing-ips-sensor"
        set status enable
        set comments "Unresolved IPS profile reference"
    next
    edit 5
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set ips-sensor-status enable
        set ips-sensor "ips-custom"
        set status disable
        set comments "Disabled interface policy"
    next
    edit 6
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set ips-sensor-status enable
        set ips-sensor "ips-custom"
        set av-profile-status enable
        set av-profile "av-custom"
        set status enable
        set comments "Multi-profile security inspection"
    next
end
