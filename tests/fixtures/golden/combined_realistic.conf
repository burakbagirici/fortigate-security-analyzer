config system interface
 edit "client"
  set role lan
 next
 edit "server"
  set role lan
 next
 edit "guest"
  set role lan
 next
 edit "dmz"
  set role dmz
 next
 edit "wan1"
  set role wan
 next
 edit "wan2"
  set role wan
 next
 edit "branch-vpn"
  set type tunnel
 next
end
config system zone
 edit "USERS"
  set interface "client" "guest"
 next
end
config system sdwan
 set status enable
 config zone
  edit "INTERNET"
  next
 end
 config members
  edit 1
   set interface "wan1"
   set zone "INTERNET"
  next
  edit 2
   set interface "wan2"
   set zone "INTERNET"
  next
 end
end
config firewall address
 edit "CLIENT-NET"
  set subnet 10.10.0.0 255.255.255.0
 next
 edit "SERVER-NET"
  set subnet 10.20.0.0 255.255.255.0
 next
 edit "DMZ-WEB"
  set subnet 10.30.0.10 255.255.255.255
 next
end
config firewall service custom
 edit "APP-8443"
  set tcp-portrange 8443
 next
end
config firewall vip
 edit "PUBLIC-WEB"
  set extip 198.51.100.50
  set mappedip "10.30.0.10"
  set portforward enable
  set extport 443
  set mappedport 443
 next
end
config antivirus profile
 edit "AV-STANDARD"
 next
end
config ips sensor
 edit "IPS-SERVER"
 next
end
config firewall internet-service-name
 edit "Approved-Updates"
  set internet-service-id 100001
 next
end
config vpn ipsec phase1-interface
 edit "branch-vpn"
  set interface "wan1"
  set ike-version 2
  set proposal aes256-sha256
 next
end
config system dns
 set primary 192.0.2.53
 set secondary 192.0.2.54
 set protocol cleartext
end
config system ntp
 set ntpsync enable
 config ntpserver
  edit 1
   set server "time.example.invalid"
  next
 end
end
config firewall policy
 edit 10
  set name "Clients to Internet"
  set srcintf "client"
  set dstintf "INTERNET"
  set srcaddr "CLIENT-NET"
  set dstaddr "all"
  set service "HTTPS" "DNS"
  set action accept
  set nat enable
  set utm-status enable
  set av-profile "AV-STANDARD"
  set ssl-ssh-profile "certificate-inspection"
 next
 edit 20
  set name "Clients to App"
  set srcintf "client"
  set dstintf "server"
  set srcaddr "CLIENT-NET"
  set dstaddr "SERVER-NET"
  set service "APP-8443"
  set action accept
 next
 edit 30
  set name "Publish Web"
  set srcintf "wan1"
  set dstintf "dmz"
  set srcaddr "all"
  set dstaddr "PUBLIC-WEB"
  set service "HTTPS"
  set action accept
  set utm-status enable
  set ips-sensor "IPS-SERVER"
 next
 edit 40
  set name "Branch Access"
  set srcintf "branch-vpn"
  set dstintf "server"
  set srcaddr "all"
  set dstaddr "SERVER-NET"
  set service "APP-8443"
  set action accept
 next
 edit 50
  set name "Approved Updates"
  set srcintf "server"
  set dstintf "INTERNET"
  set srcaddr "SERVER-NET"
  set internet-service enable
  set internet-service-id 100001
  set action accept
  set utm-status enable
  set av-profile "AV-STANDARD"
 next
 edit 60
  set name "Retired Guest Rule"
  set status disable
  set srcintf "guest"
  set dstintf "INTERNET"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action accept
 next
end
