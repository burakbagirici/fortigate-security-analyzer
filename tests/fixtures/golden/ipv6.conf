#config-version=FG100F-7.2.5-build1517:00000000
config system global
    set hostname "FortiGate-IPv6-Golden"
end
config system interface
    edit "wan1"
        set role wan
        set allowaccess ping https
    next
    edit "lan1"
        set role lan
        set allowaccess ping
    next
    edit "dmz1"
        set role dmz
        set allowaccess ping
    next
end
config ips sensor
    edit "ips-custom"
    next
end
config antivirus profile
    edit "av-custom"
    next
end
config firewall address
    edit "CORP_NET4"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall address6
    edit "CORP_NET6"
        set ip6 2001:db8:1::/48
    next
    edit "SERVER6"
        set ip6 2001:db8:1::10/128
    next
    edit "GUEST_NET6"
        set ip6 2001:db8:2::/64
    next
    edit "all"
        set ip6 ::/0
    next
end
config firewall addrgrp6
    edit "GRP_INTERNAL6"
        set member "CORP_NET6" "SERVER6"
    next
end
config firewall vip6
    edit "VIP_WEB6"
        set extip 2001:db8:feed::80
        set mappedip 2001:db8:1::80
    next
end
config user group
    edit "SSL_VPN_Group"
    next
end
config firewall policy
    edit 1
        set name "IPv4-Corporate-Internet"
        set srcintf "lan1"
        set dstintf "wan1"
        set srcaddr "CORP_NET4"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "ips-custom"
        set logtraffic all
    next
    edit 2
        set name "IPv6-Corporate-Internet"
        set srcintf "lan1"
        set dstintf "wan1"
        set srcaddr6 "CORP_NET6"
        set dstaddr6 "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "ips-custom"
        set logtraffic all
    next
    edit 3
        set name "IPv6-Shadowed-Subnet"
        set srcintf "lan1"
        set dstintf "wan1"
        set srcaddr6 "SERVER6"
        set dstaddr6 "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 4
        set name "IPv6-Inbound-VIP"
        set srcintf "wan1"
        set dstintf "dmz1"
        set srcaddr6 "all"
        set dstaddr6 "VIP_WEB6"
        set action accept
        set schedule "always"
        set service "HTTP"
        set utm-status enable
        set ips-sensor "ips-custom"
        set logtraffic all
    next
    edit 5
        set name "IPv6-Disabled-Policy"
        set srcintf "lan1"
        set dstintf "wan1"
        set srcaddr6 "GUEST_NET6"
        set dstaddr6 "all"
        set action accept
        set status disable
        set service "ALL"
    next
end
config firewall local-in-policy6
    edit 1
        set intf "wan1"
        set srcaddr6 "all"
        set dstaddr6 "all"
        set action deny
        set service "SSH"
        set status enable
        set comments "Block SSH on IPv6 WAN"
    next
    edit 2
        set intf "lan1"
        set srcaddr6 "CORP_NET6"
        set dstaddr6 "all"
        set action accept
        set service "HTTPS"
        set status enable
        set comments "Allow management from IPv6 LAN"
    next
end
config firewall interface-policy6
    edit 1
        set interface "wan1"
        set srcaddr6 "all"
        set dstaddr6 "all"
        set service6 "ALL"
        set ips-sensor-status enable
        set ips-sensor "ips-custom"
        set logtraffic all
        set status enable
        set comments "Inbound IPv6 WAN IPS inspection"
    next
end
config vpn ssl settings
    set status enable
    set source-interface "wan1"
    set source-address "all"
    set source-address6 "CORP_NET6"
    set default-portal "full-access"
    config authentication-rule
        edit 1
            set groups "SSL_VPN_Group"
            set portal "full-access"
            set source-interface "wan1"
            set source-address6 "CORP_NET6"
        next
    end
end
