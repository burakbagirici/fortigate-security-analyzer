config system interface
 edit "lan"
  set role lan
 next
 edit "wan"
  set role wan
 next
end
config firewall internet-service-name
 edit "Google-Gmail"
  set internet-service-id 65646
 next
end
config firewall internet-service-group
 edit "Cloud"
  set member "Google-Gmail"
 next
end
config firewall internet-service-custom
 edit "Local-App"
  set comment "Synthetic local service"
 next
end
config firewall policy
 edit 1
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set internet-service enable
  set internet-service-id 65646
  set action accept
 next
 edit 2
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set internet-service enable
  set internet-service-name "Google-Gmail"
  set action accept
 next
 edit 3
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set internet-service enable
  set internet-service-group "Cloud"
  set action accept
 next
 edit 4
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set internet-service enable
  set internet-service-custom "Local-App"
  set action accept
 next
 edit 5
  set srcintf "wan"
  set dstintf "lan"
  set internet-service-src enable
  set internet-service-src-name "Google-Gmail"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
 next
 edit 6
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set internet-service enable
  set internet-service-fortiguard "FQDN-Example-Updates"
  set action accept
 next
end
