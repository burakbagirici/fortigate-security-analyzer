config system interface
 edit "lan"
  set role lan
 next
 edit "wan"
  set role wan
 next
end
config system zone
 edit "LAN-ZONE"
  set interface "lan"
 next
end
config system sdwan
 config zone
  edit "WAN-ZONE"
  next
 end
 config members
  edit 1
   set interface "wan"
   set zone "WAN-ZONE"
  next
 end
end
config firewall policy
 edit 1
  set srcintf "missing-interface"
  set dstintf "wan"
  set srcaddr "missing-address"
  set dstaddr "all"
  set service "missing-service"
  set action accept
  set utm-status enable
  set av-profile "missing-profile"
 next
 edit 2
  set srcintf "any"
  set dstintf "WAN-ZONE"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
 next
 edit 3
  set srcintf "LAN-ZONE"
  set dstintf "WAN-ZONE"
  set srcaddr "all"
  set internet-service enable
  set internet-service-name "Valid-Predefined-Offline"
  set action accept
 next
end
