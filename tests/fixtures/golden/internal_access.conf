config system interface
 edit "clients"
  set role lan
 next
 edit "dmz"
  set role dmz
 next
 edit "servers"
  set role lan
 next
end
config firewall service custom
 edit "APP-8443"
  set tcp-portrange 8443
 next
end
config firewall policy
 edit 1
  set srcintf "clients"
  set dstintf "dmz"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTP"
  set action accept
 next
 edit 2
  set srcintf "clients"
  set dstintf "servers"
  set srcaddr "all"
  set dstaddr "all"
  set service "APP-8443"
  set action accept
 next
end
