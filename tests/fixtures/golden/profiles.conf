config system interface
 edit "lan"
  set role lan
 next
 edit "wan"
  set role wan
 next
 edit "dmz"
  set role dmz
 next
end
config antivirus profile
 edit "av-good"
 next
end
config ips sensor
 edit "ips-good"
 next
end
config firewall vip
 edit "WEB-VIP"
  set extip 198.51.100.30
  set mappedip "10.30.0.10"
 next
end
config firewall policy
 edit 1
  set name "Profiled outbound"
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
  set utm-status enable
  set av-profile "av-good"
  set ssl-ssh-profile "certificate-inspection"
 next
 edit 2
  set name "Unprofiled outbound"
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTP"
  set action accept
 next
 edit 3
  set name "Protected publishing"
  set srcintf "wan"
  set dstintf "dmz"
  set srcaddr "all"
  set dstaddr "WEB-VIP"
  set service "HTTPS"
  set action accept
  set utm-status enable
  set ips-sensor "ips-good"
 next
 edit 4
  set name "Missing profile"
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
  set utm-status enable
  set av-profile "not-present"
 next
end
