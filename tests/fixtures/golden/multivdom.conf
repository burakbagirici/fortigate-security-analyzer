config vdom
 edit "VDOM-A"
  config system interface
   edit "port1"
    set role lan
   next
   edit "wan"
    set role wan
   next
  end
  config firewall address
   edit "SHARED"
    set subnet 10.1.0.0 255.255.0.0
   next
  end
  config firewall service custom
   edit "APP"
    set tcp-portrange 8001
   next
  end
  config antivirus profile
   edit "PROFILE"
   next
  end
  config firewall policy
   edit 1
    set srcintf "port1"
    set dstintf "wan"
    set srcaddr "SHARED"
    set dstaddr "all"
    set service "APP"
    set action accept
    set utm-status enable
    set av-profile "PROFILE"
   next
   edit 2
    set srcintf "port1"
    set dstintf "wan"
    set srcaddr "SHARED"
    set dstaddr "all"
    set service "APP"
    set action accept
   next
  end
 next
 edit "VDOM-B"
  config system interface
   edit "port1"
    set role dmz
   next
   edit "wan"
    set role wan
   next
  end
  config firewall address
   edit "SHARED"
    set subnet 10.2.0.0 255.255.0.0
   next
  end
  config firewall service custom
   edit "APP"
    set tcp-portrange 8002
   next
  end
  config antivirus profile
   edit "PROFILE"
   next
  end
  config firewall policy
   edit 1
    set srcintf "port1"
    set dstintf "wan"
    set srcaddr "SHARED"
    set dstaddr "all"
    set service "APP"
    set action accept
    set utm-status enable
    set av-profile "PROFILE"
   next
  end
 next
end
