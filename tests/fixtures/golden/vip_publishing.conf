config system interface
 edit "wan1"
  set role wan
 next
 edit "dmz1"
  set role dmz
 next
end
config firewall address
 edit "WEB-SERVER"
  set subnet 10.20.0.10 255.255.255.255
 next
end
config firewall vip
 edit "PUBLIC-WEB"
  set extip 198.51.100.20
  set mappedip "10.20.0.10"
  set extintf "wan1"
  set portforward enable
  set extport 443
  set mappedport 443
 next
end
config firewall policy
 edit 10
  set name "Publish HTTPS"
  set srcintf "wan1"
  set dstintf "dmz1"
  set srcaddr "all"
  set dstaddr "PUBLIC-WEB"
  set service "HTTPS"
  set action accept
 next
end
