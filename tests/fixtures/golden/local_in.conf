config system global
    set hostname "FortiGate-LocalIn-Golden"
end
config system interface
    edit "wan1"
        set role wan
        set allowaccess ping https ssh
    next
    edit "mgmt1"
        set dedicated-to management
        set allowaccess https ssh
    next
end
config system admin
    edit "admin"
        set trusthost1 192.168.1.0 255.255.255.0
    next
end
config firewall address
    edit "ADMIN_NET"
        set subnet 192.168.1.0 255.255.255.0
    next
end
config firewall local-in-policy
    edit 1
        set intf "wan1"
        set srcaddr "ADMIN_NET"
        set dstaddr "all"
        set action accept
        set service "SSH"
        set schedule "always"
        set status enable
        set comments "Allow WAN SSH from Admin Net"
    next
    edit 2
        set intf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set service "PING"
        set schedule "always"
        set status enable
    next
    edit 3
        set intf "mgmt1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
        set schedule "always"
        set status enable
    next
    edit 4
        set intf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTP"
        set status disable
    next
    edit 5
        set intf "wan1"
        set srcaddr "MISSING_ADDR_OBJ"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
    next
    edit 6
        set intf "wan1"
        set internet-service-src enable
        set internet-service-src-name "Google-Web"
        set action accept
        set service "ALL"
    next
end
