config system interface
 edit "lan1"
  set role lan
 next
 edit "uplink1"
  set role wan
 next
 edit "port3"
  set alias "External Internet"
 next
end
config firewall policy
 edit 1
  set name "Explicit WAN"
  set srcintf "lan1"
  set dstintf "uplink1"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action accept
  set nat enable
 next
 edit 2
  set name "Alias WAN"
  set srcintf "lan1"
  set dstintf "port3"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action accept
  set nat enable
 next
end
