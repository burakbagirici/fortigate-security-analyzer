config system interface
 edit "wan1"
  set role wan
  set allowaccess ping https ssh http telnet
 next
 edit "port2"
  set alias "External Backup"
  set allowaccess https
 next
 edit "lan1"
  set role lan
  set allowaccess https ssh http telnet
 next
end
config system admin
 edit "restricted-admin"
  set accprofile "super_admin"
  set trusthost1 192.0.2.10 255.255.255.255
 next
 edit "review-admin"
  set accprofile "super_admin"
 next
end
