config system interface
 edit "lan"
  set role lan
 next
 edit "branch_tunnel"
  set type tunnel
 next
end
config vpn ipsec phase1-interface
 edit "branch_tunnel"
  set interface "wan1"
  set ike-version 2
  set proposal aes256-sha256
 next
end
config firewall policy
 edit 1
  set srcintf "lan"
  set dstintf "branch_tunnel"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action accept
 next
 edit 2
  set srcintf "branch_tunnel"
  set dstintf "lan"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action accept
 next
end
