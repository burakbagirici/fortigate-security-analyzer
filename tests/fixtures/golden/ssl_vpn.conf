#config-version=FG100F-7.2.5-build1517:00000000
config system global
    set hostname "FortiGate-SSLVPN-Golden"
end
config system interface
    edit "wan1"
        set role wan
        set allowaccess ping https ssh
    next
    edit "lan1"
        set role lan
        set allowaccess ping
    next
    edit "mgmt1"
        set dedicated-to management
        set allowaccess https ssh
    next
end
config firewall address
    edit "SSL_VPN_Pool"
        set type iprange
        set start-ip 10.212.134.200
        set end-ip 10.212.134.210
    next
    edit "Internal_Subnet"
        set subnet 10.0.1.0 255.255.255.0
    next
    edit "Restricted_Admins"
        set subnet 198.51.100.50 255.255.255.255
    next
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config user local
    edit "contractor_bob"
        set type password
        set status enable
    next
end
config user group
    edit "SSL_VPN_Users"
        set member "contractor_bob"
    next
end
config vpn ssl web portal
    edit "corporate-tunnel"
        set tunnel-mode enable
        set web-mode disable
        set split-tunneling enable
        set split-tunneling-routing-address "Internal_Subnet"
        set ip-pools "SSL_VPN_Pool"
    next
    edit "vendor-web"
        set tunnel-mode disable
        set web-mode enable
    next
end
config vpn ssl settings
    set status enable
    set servercert "Fortinet_Factory"
    set ssl-min-proto-ver tls1-2
    set port 10443
    set source-interface "wan1"
    set source-address "Restricted_Admins"
    set default-portal "full-access"
    config authentication-rule
        edit 1
            set source-interface "wan1"
            set groups "SSL_VPN_Users"
            set portal "corporate-tunnel"
        next
        edit 2
            set users "contractor_bob"
            set portal "vendor-web"
        next
        edit 3
            set groups "Unresolved_Group"
            set portal "nonexistent-portal"
        next
    end
end
config firewall policy
    edit 1
        set srcintf "ssl.root"
        set dstintf "lan1"
        set srcaddr "all"
        set dstaddr "Internal_Subnet"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
