config system interface
 edit "lan1"
  set role lan
 next
 edit "lan2"
  set role lan
 next
 edit "wan1"
  set role wan
 next
 edit "wan2"
  set role wan
 next
 edit "dmz1"
  set role dmz
 next
end
config system zone
 edit "CLIENT-ZONE"
  set interface "lan1" "lan2"
 next
 edit "MIXED-ZONE"
  set interface "lan1" "wan1"
 next
end
config system sdwan
 set status enable
 config zone
  edit "INTERNET-ZONE"
  next
 end
 config members
  edit 1
   set interface "wan1"
   set zone "INTERNET-ZONE"
  next
  edit 2
   set interface "wan2"
   set zone "INTERNET-ZONE"
  next
 end
end
config firewall policy
 edit 1
  set srcintf "CLIENT-ZONE"
  set dstintf "INTERNET-ZONE"
  set srcaddr "all"
  set dstaddr "all"
  set service "ALL"
  set action accept
 next
 edit 2
  set srcintf "MIXED-ZONE"
  set dstintf "dmz1"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
 next
 edit 3
  set srcintf "any"
  set dstintf "dmz1"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
 next
end
