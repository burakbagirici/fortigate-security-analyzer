config system admin
 edit "admin"
  set accprofile "super_admin"
  set password "FAKE_PASSWORD_123"
  set old-password "FAKE_OLD_PASSWORD_456"
  set token "FAKE_API_TOKEN_789"
 next
end
config vpn ipsec phase1-interface
 edit "vpn"
  set interface "wan"
  set psksecret "FAKE_PSK_SECRET_ABC"
  set private-key "FAKE_PRIVATE_KEY_DEF"
 next
end
config system snmp community
 edit 1
  set name "FAKE_SNMP_COMMUNITY_GHI"
 next
end
config firewall policy
 edit 1
  set name "Safe policy"
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "all"
  set dstaddr "all"
  set service "HTTPS"
  set action accept
 next
end
