#config-version=FG100F-7.2.11-FW-build1740-241015:opmode=0:vdom=0:user=admin
config system global
    set hostname "FGT-OVERRIDE-01"
    set admintimeout 30
end
config system admin
    edit "admin"
        set two-factor disable
        set trusthost1 10.0.0.0 255.255.255.0
    next
end
config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set role wan
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 10.0.1.1 255.255.255.0
        set allowaccess ping
        set role lan
    next
end
config firewall policy
    edit 1
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.10.10.10"
        next
    end
end
