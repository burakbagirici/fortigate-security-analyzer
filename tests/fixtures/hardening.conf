config system global
    set hostname "FortiGate-Core"
    set admin-ssh-v1 enable
    set admin-https-ssl-versions tls-v1.0 tls-v1.1
    set strong-crypto disable
    set admin-console-timeout 60
    set admin-password "HASHED_ADMIN_PASSWORD_SECRET"
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password "ENC_HASH_12345"
        set trusthost1 0.0.0.0 0.0.0.0
    next
    edit "restricted_admin"
        set accprofile "read_only"
        set trusthost1 192.168.1.0 255.255.255.0
    next
end
config system dns
    set domain "example.local"
end
config system ntp
    set ntpsync disable
    set type custom
end
config system interface
    edit "port1"
        set role wan
        set allowaccess http telnet https ssh
    next
end
